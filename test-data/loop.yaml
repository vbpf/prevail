---
test-case: descending meet keeps apart what its operands say about a type alternative

# r3 is a number on entry and a pointer in every later iteration. <never> is feasible only while r2 is widened, and
# puts r3.svalue and r4.svalue on the line r3 - r4 == 4096. The next evaluation of the loop drops <never>, so r3.svalue
# is 4104 again. Both facts hold only where r3 is a number: together they must not imply r4 == 8.

pre: ["r1.type=ctx", "r1.ctx_offset=0", "r10.type=stack", "r10.stack_offset=4096"]

code:
  <start>: |
    r6 = r1
    r3 = 4104
    r4 = 8
    r2 = 0
  <head>: |
    if r2 > 100 goto <never>
  <guard>: |
    if r2 >= 10 goto <out>
  <body>: |
    r3 = r6
    goto <next>
  <never>: |
    r3 = 0
    r2 = 5
  <next>: |
    r4 = -4096
    r2 += 1
    goto <head>
  <out>: |
    r5 = r10
    r5 -= r4
    *(u64 *)(r5 + 0) = r2
    r0 = 0
    exit

post: ["_|_"]

messages:
  - "4:8: Code becomes unreachable (assume r2 > 100)"
  - "15: Upper bound must be at most total_stack_size (valid_access(r5.offset, width=8) for write)"
---
test-case: bounded 32-bit stack counter loop with local call

# The induction variable lives in a 4-byte stack slot that each iteration
# overwrites in place. The strong update must keep the slot's svalue, or the
# relation between the slot and the loop counter is lost (issue #1236).

options: ["termination"]
pre: ["r10.type=stack", "r10.stack_offset=4096"]
code:
  <start>: |
    r0 = 0
    *(u32 *)(r10 - 4) = r0
    *(u32 *)(r10 - 12) = r0
    r1 = *(u32 *)(r10 - 12)
    if r1 s> 9 goto <out>
    r6 = 10
  <loop>: |
    r1 = r0
    call <increment>
    r1 = *(u32 *)(r10 - 12)
    r1 += 1
    *(u32 *)(r10 - 12) = r1
    r1 = *(u32 *)(r10 - 12)
    if r6 s> r1 goto <loop>
  <out>: |
    exit
  <increment>: |
    r0 = r1
    r0 += 1
    exit

post:
  - pc[6]=10
  - r0.type=number
  - r0.svalue=pc[6]
  - r0.uvalue=pc[6]
  - r1.type=number
  - r1.svalue=pc[6]
  - r1.uvalue=pc[6]
  - r6.type=number
  - r6.svalue=10
  - r6.uvalue=10
  - r10.type=stack
  - r10.stack_offset=4096
  - s[4084...4087].type=number
  - s[4084...4087].svalue=pc[6]
  - s[4084...4087].uvalue=pc[6]
  - s[4092...4095].type=number
  - s[4092...4095].svalue=0
  - s[4092...4095].uvalue=0

messages:
  - "4:13: Code becomes unreachable (assume r1 s> 9)"
---
test-case: narrowing a type set forgets the kind variables of the removed type

# r4 lags two iterations behind r2, so <never> becomes infeasible only in the second descending
# iteration, which uses narrow(). It removes number from r6's types; r6.svalue=0 must go with it,
# or <live> is considered unreachable.

pre: ["r1.type=ctx", "r1.ctx_offset=0", "r1.uvalue=[1, 2147418112]"]

code:
  <start>: |
    r6 = r1
    r2 = 0
    r4 = 0
    r5 = 0
  <head>: |
    if r2 > 9 goto <out>
    if r4 > 100 goto <never>
    r6 = r1
    r4 = r5
    r5 = r2
    r2 += 1
    goto <head>
  <never>: |
    r6 = 0
    r2 = 10
    r4 = 0
    r5 = 0
    goto <head>
  <out>: |
    if r6 != 0 goto <live>
  <null>: |
    goto <null>
  <live>: |
    r3 = 1
    r0 = *(u64 *)(r3 + 0)
    exit

post: ["_|_"]

messages:
  - "5:11: Code becomes unreachable (assume r4 > 100)"
  - "19: Invalid type (r3.type in {ctx, stack, packet, shared, socket, alloc_mem})"
---
test-case: meet at a loop head ignores the kind variables of the removed type

# <never> becomes infeasible in the first descending iteration, which uses meet. r6.svalue=0 describes
# the number that <never> assigns and must not contradict the svalue of the pointer that remains,
# or the loop head is considered unreachable.

pre: ["r1.type=ctx", "r1.ctx_offset=0", "r1.uvalue=[1, 2147418112]"]

code:
  <start>: |
    r3 = 8
    r6 = r1
    r6 += r3
    r2 = 0
    r4 = 0
  <head>: |
    if r2 > 9 goto <out>
    if r4 > 100 goto <never>
    r6 = r1
    r6 += r3
    r4 = r2
    r4 *= 3
    r2 += 1
    goto <head>
  <never>: |
    r6 = 0
    r2 = 10
    r4 = 0
    goto <head>
  <out>: |
    r3 = 1
    r0 = *(u64 *)(r3 + 0)
    exit

post: ["_|_"]

messages:
  - "6:13: Code becomes unreachable (assume r4 > 100)"
  - "18: Invalid type (r3.type in {ctx, stack, packet, shared, socket, alloc_mem})"
