---
test-case: realistic forward loop
options: ["termination"]

pre: [
  "meta_offset=[-4098, 0]",
  "packet_size=[0, 65534]",
  "r1.ctx_offset=0", "r1.type=ctx",
]

code:
  <start>: |
    r0 = 0
    r2 = *(u32 *)(r1 + 4)
    r1 = *(u32 *)(r1 + 0)
    assume r2 != r1
    r2 -= r1
    r3 = 0
    r0 = 0
  #    r2 <<= 32; this fails with "11: Upper bound must be at most packet_size (valid_access(r4.offset, width=1) for read)"
  #    r2 >>= 32
  <loop>: |
    r4 = r1
    r4 += r3
    r4 = *(u8 *)(r4 + 0)
    r0 += r4
    r3 += 1
    if r4 == r3 goto <exit>
    assume r2 > r3
    goto <loop>
  <exit>: |
    exit

post:
  - r2.uvalue=packet_size
  - r2.svalue=packet_size
  - r3.uvalue=pc[7]
  - r3.svalue=pc[7]
  - r4.svalue=pc[7]
  - r4.uvalue=pc[7]
  - meta_offset=[-4098, 0]
  - packet_size=1
  - pc[7]=[1, 255]
  - r0.type=number
  - r1.packet_offset=0
  - r1.packet_offset-packet_size<=-1  # unclear if this should be here
  - r1.uvalue=[0, 2147418112]
  - r1.type=packet
  - r2.type=number
  - r3.type=number
  - r4.type=number

