---
# The low 32 bits of a pointer produced by a 32-bit op must not be usable as a
# scalar: doing so would launder a (possibly kernel) address into a number that
# can be returned or stored, leaking it. The forgotten result is not provably a
# number, so returning it is rejected -- the pointer cannot be leaked this way.
test-case: 32-bit pointer truncation - result is not leakable

pre:
  - "r1.type=ctx"
  - "r1.ctx_offset=0"
  - "r1.svalue=8"
  - "r1.uvalue=8"
  - "r2.type=number"
  - "r2.svalue=0"
  - "r2.uvalue=0"

code:
  <start>: |
    w1 += w2
    r0 = r1
    exit

post:
  - "_|_"

messages:
  - "2: Invalid type (r0.type == number)"

---
# Regression tests: a nullable pointer records "may be null" only as 0 being a
# possible uvalue. Arithmetic used to shift uvalue along with the offset, so
# after r0 += 4 the interval started at 4, the pointer counted as non-null, and
# an access at -4 (address 0 when the lookup misses) was accepted without any
# null check. ADD and SUB now assert that their pointer operands are non-null.
test-case: possibly-null pointer arithmetic - add immediate

pre: ["r1.type=map_fd", "r1.map_fd=1", "r1.uvalue=[1, 2147418112]",
      "r2.type=stack", "r2.stack_offset=504",
      "s[504...511].type=number"]

code:
  <start>: |
    call 1; bpf_map_lookup_elem
    r0 += 4
    r1 = *(u32 *)(r0 - 4)

post:
  - "_|_"

messages:
  - "1: Pointer arithmetic on a possibly null pointer (non_null(r0))"

