---
# Verify that truncating a pointer and converting it to a number triggers a warning.
test-case: 32-bit return context pointer

pre:
  - r0.uvalue=0
  - r0.uvalue=r0.svalue
  - r0.type=number
  - r1.ctx_offset=0
  - r1.svalue=1234567890
  - r1.uvalue=r1.svalue
  - r1.type=ctx
  - r1.uvalue=1234567890

code:
  <start>: |
    w0 = w1

post:
  - "_|_"

messages:
  - "0: Invalid type (r1.type == number)"

---
# Regression test: when a register carries a non-singleton typeset (here
# {ctx, shared}), add() must advance the offset of every possible type rather
# than leave any of them stale; otherwise the post-add bounds check uses the
# pre-add offset and accepts an out-of-bounds access. After advancing the
# pointer past both regions, the dereference must be rejected.
test-case: non-singleton typeset pointer add advances every offset

pre: ["r1.type in {ctx, shared}",
      "r1.ctx_offset=8",
      "r1.shared_offset=8", "r1.shared_region_size=16",
      "r1.svalue=8", "r1.uvalue=8"]

code:
  <start>: |
    r1 += 56
    r2 = *(u64 *)(r1 + 0)

post:
  - "_|_"

messages:
  - "1: Upper bound must be at most 64 (valid_access(r1.offset, width=8) for read)"

---
# A constant add to a {stack, shared} pointer advances the stack offset and
# the shared offset independently, keeping the shared region size, so an
# access that is in bounds under both types is accepted (issue #1237).
test-case: stack and shared pointer add keeps both offsets

pre: ["r10.type=stack", "r10.stack_offset=4096",
      "r8.type in {stack, shared}",
      "r8.stack_offset=3936", "r8.stack_numeric_size=56",
      "r8.shared_offset=0", "r8.shared_region_size=56",
      "r8.uvalue=[1, 2147418112]",
      "s[3968...3968].type=number"]

code:
  <start>: |
    r3 = 0
    r3 = r8
    r3 += 32
    r0 = *(u8 *)(r3 + 0)

post:
  - r0.type=number
  - r3.type in {stack, shared}
  - r3.stack_offset=3968
  - r3.shared_offset=32
  - r3.shared_region_size=56
  - r3.stack_numeric_size=1
  - r3.svalue=[33, 2147418144]
  - r3.svalue=r8.uvalue+32
  - r3.uvalue=r3.svalue
  - r8.type=r3.type
  - r8.stack_offset=3936
  - r8.stack_numeric_size=56
  - r8.shared_offset=0
  - r8.shared_region_size=56
  - r8.uvalue=[1, 2147418112]
  - r10.type=stack
  - r10.stack_offset=4096
  - s[3968].type=number

---
# Companion: each type's advanced offset is checked against its own region.
# Past the shared region the {stack, shared} pointer is out of bounds on the
# shared path even though the stack path is fine, so the access is rejected.
test-case: stack and shared pointer add past the shared region is rejected

pre: ["r10.type=stack", "r10.stack_offset=4096",
      "r8.type in {stack, shared}",
      "r8.stack_offset=3936", "r8.stack_numeric_size=160",
      "r8.shared_offset=0", "r8.shared_region_size=56",
      "r8.uvalue=[1, 2147418112]",
      "s[3936...4095].type=number"]

code:
  <start>: |
    r8 += 56
    r0 = *(u8 *)(r8 + 0)

post:
  - "_|_"

messages:
  - "1: Upper bound must be at most r8.shared_region_size (valid_access(r8.offset, width=1) for read)"

---
# Symmetric regression on the register-register
# subtract path (ptr -= num with a non-singleton destination typeset).
test-case: non-singleton typeset pointer sub invalidates offsets

pre: ["r1.type in {ctx, shared}",
      "r1.ctx_offset=8",
      "r1.shared_offset=8", "r1.shared_region_size=16",
      "r1.svalue=8", "r1.uvalue=8",
      "r2.type=number", "r2.svalue=16", "r2.uvalue=16"]

code:
  <start>: |
    r1 -= r2
    r3 = *(u64 *)(r1 + 0)

post:
  - "_|_"

messages:
  - "1: Lower bound must be at least 0 (valid_access(r1.offset, width=8) for read)"

---
# Regression test for the {number, pointer} union case: a register that may be a
# number or a pointer takes the numeric add/sub fast-path, which advances
# svalue/uvalue but not any pointer offset. The pointer offset must be
# invalidated rather than left stale; here ctx_offset must not survive the add.
test-case: mixed number-pointer add invalidates pointer offset

pre: ["r1.type in {number, ctx}", "r1.ctx_offset=8", "r1.svalue=8", "r1.uvalue=8"]

code:
  <start>: |
    r1 += 56

post:
  - r1.svalue=64
  - r1.type in {number, ctx}
  - r1.uvalue=64

---
# Companion showing the conservative havoc only affects offsets *after*
# arithmetic: a non-singleton {ctx, shared} register dereferenced directly,
# in bounds and without prior arithmetic, still passes.
test-case: non-singleton typeset in-bounds access still passes

pre: ["r1.type in {ctx, shared}",
      "r1.ctx_offset=0", "r1.shared_offset=0", "r1.shared_region_size=16",
      "r1.svalue=8", "r1.uvalue=8"]

code:
  <start>: |
    r2 = *(u64 *)(r1 + 0)

post:
  - r1.ctx_offset=0
  - r1.shared_offset=0
  - r1.shared_region_size=16
  - r1.svalue=8
  - r1.type in {ctx, shared}
  - r1.uvalue=8

---
# Regression test: 32-bit (ALU32) ADD/SUB on a pointer register. ALU32
# zero-extends its 32-bit result, destroying the upper half of a live pointer,
# so the result cannot be a usable pointer. The immediate forms above were
# already caught, but the register-register form kept the pointer type: r1
# stayed ctx and the following load synthesized a fresh valid packet pointer.
# The result is now retyped as the scalar it is, so the dereference is rejected.
test-case: 32-bit pointer truncation - register addition

pre:
  - "r1.ctx_offset=0"
  - "r1.svalue=[0, 4294967295]"
  - "r1.uvalue=r1.svalue"
  - "r1.type=ctx"
  - "r1.uvalue=[0, 4294967295]"
  - "r2.type=number"
  - "r2.svalue=0"
  - "r2.uvalue=0"

code:
  <start>: |
    w1 += w2
    r3 = *(u32 *)(r1 + 0)

post:
  - "_|_"

messages:
  - "1: Invalid type (r1.type in {ctx, stack, packet, shared, socket, alloc_mem})"

