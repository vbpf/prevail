---
test-case: counted loop wholly inside a bpf-to-bpf callee keeps its back-edge

# Regression for issue #1203: a loop contained entirely within an inlined
# bpf-to-bpf subprogram must keep its back-edge after inlining. Otherwise the
# clone is analyzed straight-line (no widening, no loop-counter insertion) and
# the loop body is verified for a single iteration. The pc[...] loop counter in
# the post-invariant only appears if the back-edge survived.

options: ["termination"]
pre: []

code:
  <start>: |
    call <sub>
    exit
  <sub>: |
    r0 = 0
  <sub_loop>: |
    r0 += 1
    if r0 < 4 goto <sub_loop>
  <sub_out>: |
    exit

post:
  - r0.type=number
  - pc[0/3]=4
  - r0.svalue=pc[0/3]
  - r0.uvalue=pc[0/3]
---
test-case: out-of-bounds packet walk in an inlined callee loop is rejected

# Companion to the counted-loop regression above, demonstrating the *unsound*
# outcome the #1203 fix removes. The callee walks a packet pointer one byte
# further every iteration and reads through it, without re-checking the read
# against packet_size. `assume r2 != r1` guarantees at least one byte, so the
# first read (packet[0]) is in bounds. Before the fix the callee loop lost its
# back-edge and was analyzed for that single iteration, so the read on later
# iterations was never checked and the program was accepted (accept-unsafe).
# With the back-edge restored the loop is widened, the read index is no longer
# bounded by packet_size, and the access is correctly rejected.

options: ["termination"]
pre: [
  "meta_offset=[-4098, 0]",
  "packet_size=[0, 65534]",
  "r1.ctx_offset=0", "r1.type=ctx",
]

code:
  <start>: |
    call <sub>
    exit
  <sub>: |
    r2 = *(u32 *)(r1 + 4)
    r1 = *(u32 *)(r1 + 0)
    assume r2 != r1
    r2 -= r1
    r3 = 0
  <sub_loop>: |
    r4 = r1
    r4 += r3
    r4 = *(u8 *)(r4 + 0)
    r3 += 1
    if r3 < 100 goto <sub_loop>
    exit

post:
  - "_|_"

messages:
  - "0/9: Upper bound must be at most packet_size (valid_access(r4.offset, width=1) for read)"
  - "0/11:12: Code becomes unreachable (assume r3 >= 100)"
---
test-case: pointer reloaded from the callee frame below numeric caller bytes is not a number

# The caller makes the lowest 8 bytes of its frame numeric. These are the bytes
# right above the callee's r10, so the callee runs with r10.stack_numeric_size=8.
# That size describes the bytes from r10 upwards and says nothing about a load at
# a negative offset: the load must be typed by the slot it reads. Comparing the
# width against stack_numeric_size without the offset typed the reloaded ctx
# pointer as a number, and the program was accepted (accept-unsafe).

pre: ["r1.type=ctx", "r1.ctx_offset=0", "r10.type=stack", "r10.stack_offset=4096"]

code:
  <start>: |
    r2 = 0
    *(u64 *)(r10 - 512) = r2
    call <sub>
    exit
  <sub>: |
    *(u64 *)(r10 - 8) = r1
    r0 = *(u64 *)(r10 - 8)
    exit

post:
  - "_|_"

messages:
  - "3: Invalid type (r0.type == number)"

---
test-case: callee placed before its caller keeps its frame across a nested call

# The call sites are inlined in instruction order, so g's call of h is expanded
# before main's call of g. The expansion of main's call used to walk the live
# graph into that earlier clone of h and copy it, exit included, into g's frame:
# returning from h then popped g's frame, and the load at pc 3 read main's slot
# (svalue=1) instead of g's. With a pointer spilled there by main, the store
# through it was accepted (accept-unsafe).

pre: ["r10.type=stack", "r10.stack_offset=4096"]

code:
  <start>: |
    goto <main>
  <g>: |
    *(u64 *)(r10 - 8) = 2
    call <h>
    r0 = *(u64 *)(r10 - 8)
    exit
  <h>: |
    r0 = 0
    exit
  <main>: |
    *(u64 *)(r10 - 8) = 1
    call <g>
    exit

post:
  - r0.type=number
  - r0.svalue=2
  - r0.uvalue=2
  - r10.type=stack
  - r10.stack_offset=4096
  - s[4088...4095].type=number
  - s[4088...4095].svalue=1
  - s[4088...4095].uvalue=1
---
