test-case: bpf_map_pop_elem result guards reachable code

pre: ["r1.type=map_fd", "r1.map_fd=1",
      "r2.type=stack", "r2.stack_offset=508",
      "r10.type=stack", "r10.stack_offset=512",
      "s[508...511].type=number", "s[508...511].svalue=0", "s[508...511].uvalue=0"]

code:
  <start>: |
    call 88; bpf_map_pop_elem
    r7 = *(u32 *)(r10 - 4)
    if r7 == 0 goto <out>
    r1 = 1094795585
    *(u64 *)(r1 + 0) = r7
  <out>: |
    r0 = 0
    exit

post:
  - r0.type=number
  - r0.svalue=0
  - r0.uvalue=0
  - r7.type=number
  - r7.svalue=0
  - r7.uvalue=0
  - r10.type=stack
  - r10.stack_offset=512
  - s[508...511].type=number
  - s[508...511].svalue=r7.svalue
  - s[508...511].uvalue=r7.uvalue

messages:
  - "4: Invalid type (r1.type in {ctx, stack, packet, shared, socket, alloc_mem})"
