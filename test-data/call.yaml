test-case: bpf_get_stack writing into shared memory

pre: ["r1.type=ctx", "r1.ctx_offset=0",
      "r2.type=shared", "r2.shared_offset=0", "r2.shared_region_size=64", "r2.svalue=[1, 2147418112]", "r2.uvalue=[1, 2147418112]",
      "r3.type=number", "r3.svalue=64", "r3.uvalue=64",
      "r4.type=number"]

code:
  <start>: |
    call 67; bpf_get_stack, doesn't this leak pointers into the shared memory?

post:
  - r0.type=number
---
# A helper that writes through a stack pointer must forget the type cells it may overwrite, not
# only the value cells. When the write is not a strong update the bytes are not marked numeric,
# so a surviving type cell would hand the old pointer type back to a later load.
test-case: bpf_get_stack with variable size forgets the type of a spilled pointer

pre: ["r1.type=ctx", "r1.ctx_offset=0",
      "r2.type=stack", "r2.stack_offset=504",
      "r3.type=number", "r3.svalue=[1, 8]", "r3.uvalue=[1, 8]",
      "r4.type=number",
      "r10.type=stack", "r10.stack_offset=512"]

code:
  <start>: |
    *(u64 *)(r10 - 8) = r1
    call 67; bpf_get_stack
    r1 = *(u64 *)(r10 - 8)

post:
  - r0.type=number
  - r10.type=stack
  - r10.stack_offset=512
---
